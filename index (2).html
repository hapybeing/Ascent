    <canvas id="gl" aria-hidden="true"></canvas>

    </div>

    </header>

      <span class="meter__rail"><span class="meter__tick"><span class="meter__value">&minus;120 m</span></span></span>
    </div>
    <p id="meter-live" class="sr-only" aria-live="polite"></p>

    <p id="live" class="sr-only" aria-live="polite"></p>

    <div id="end" class="end" aria-hidden="true">
      <p class="end__stay">Stay as long as you like.</p>
      <a id="descend" class="end__descend" href="#top" tabindex="-1">Descend</a>
      <p class="end__colophon">three.js, GLSL, Web Audio, GSAP, Lenis. Zodiak and DM Mono.</p>
    </div>

    <div id="cue" class="cue is-gone" aria-hidden="true">
      <span class="cue__line"></span>
      <span class="cue__word">rise</span>
    </div>

          <circle class="threshold__progress" cx="50" cy="50" r="46" />
        </svg>
        <span class="threshold__dot"></span>
      </div>
      <div class="threshold__choices" hidden>
        <button type="button" data-sound="on">Enter with sound</button>
        <button type="button" data-sound="off">Enter in silence</button>
        <p class="threshold__note">Headphones recommended</p>
      </div>
    </div>

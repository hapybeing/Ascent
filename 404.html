        background:
          radial-gradient(60vmax 40vmax at 78% 18%, rgba(252, 235, 213, 0.9), rgba(252, 235, 213, 0) 70%),
          linear-gradient(180deg, #E2D0C2 0%, #F2D6C0 46%, #BFE0E2 46.4%, #9FCFD3 100%);

        overflow: hidden;
      }
      .line {
        position: absolute; left: 9vw; top: 24vh; margin: 0;
        font-weight: 300; font-size: clamp(48px, 8vw, 140px); line-height: 1.02; letter-spacing: -0.018em;
        max-width: 11ch;
        animation: focus 2.2s cubic-bezier(.22, .8, .2, 1) both;
      }
      .back {
        position: absolute; left: 9vw; bottom: 14vh;
        font: 400 10.5px/1 'DM Mono', monospace; letter-spacing: 0.12em; text-transform: uppercase;
        color: rgba(31, 37, 64, 0.82); text-decoration: none; padding: 6px 0;
        border-bottom: 1px solid rgba(31, 37, 64, 0.3);
        animation: focus 2.4s 0.8s cubic-bezier(.22, .8, .2, 1) both;
      }
      .back:hover, .back:focus-visible { border-color: rgba(31, 37, 64, 0.8); outline: none; }
      .back:focus-visible { box-shadow: 0 0 0 4px rgba(244, 241, 236, 0.7); }
      .wisp {
        position: absolute; left: 62vw; top: 52vh; width: 10px; height: 10px; border-radius: 50%;
        background: #FBF1E6; box-shadow: 0 0 18px 8px rgba(251, 241, 230, 0.55), 0 0 60px 26px rgba(246, 220, 198, 0.35);
        animation: breathe 6s cubic-bezier(.62, 0, .28, 1) infinite alternate;
      }
      .line-of-water { position: absolute; left: 0; right: 0; top: 46.2%; height: 2px; background: rgba(251, 241, 230, 0.8); filter: blur(0.6px); }
      @keyframes focus { from { opacity: 0; filter: blur(14px); } to { opacity: 1; filter: blur(0); } }
      @keyframes breathe { from { transform: translateY(0); opacity: 0.85; } to { transform: translateY(-14px); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .line, .back, .wisp { animation: none; } }
      @media (max-aspect-ratio: 4/5) { .line { top: 16vh; font-size: clamp(44px, 12.5vw, 96px); } .wisp { left: 70vw; top: 60vh; } }

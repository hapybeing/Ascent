<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASCENT</title>
    <meta property="og:title" content="ASCENT" />
    <meta property="og:image" content="ascent-breach.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=zodiak@400,300&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&display=swap" />
    <style>
      :root {
        --ink: #1f2540;
        --pearl: #f4efe8;
        --mono: "DM Mono", ui-monospace, monospace;
        --serif: "Zodiak", Georgia, serif;
        --ease: cubic-bezier(0.22, 0.8, 0.2, 1);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: #bfe0e2;
        color: var(--ink);
        font-family: var(--serif);
        overflow-x: hidden;
      }
      #spacer { height: 800vh; }
      #whiteout { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 60% 45%, #fbf8f3, #f1efec); }
      #gl, #fallback {
        position: fixed; inset: 0; width: 100%; height: 100%;
        display: block; z-index: 0;
      }
      #fallback { object-fit: cover; display: none; }
      #fallback-copy {
        position: fixed; z-index: 3; left: 0; right: 0; bottom: 12vh;
        text-align: center; font-size: clamp(22px, 4vw, 40px);
        color: var(--ink); display: none; padding: 0 8vw;
      }
      .ui { position: fixed; z-index: 4; color: var(--ink); }
      .micro {
        font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em;
        text-transform: uppercase; font-weight: 400;
      }
      #brand { top: 26px; left: 28px; letter-spacing: 0.4em; }
      #sound {
        top: 12px; right: 18px; background: none; border: 0; cursor: pointer;
        color: var(--ink); padding: 0 10px; min-height: 44px; min-width: 44px; opacity: 0.75;
      }
      #sound:hover { opacity: 1; }
      #meter {
        left: 28px; top: 50%; transform: translateY(-50%);
        display: flex; align-items: center; gap: 12px;
      }
      #meter .rail {
        width: 1px; height: 38vh; background: rgba(31, 37, 64, 0.22); position: relative;
      }
      #meter .bead {
        position: absolute; left: -2px; width: 5px; height: 5px; border-radius: 50%;
        background: var(--ink); transform: translateY(-50%);
      }
      #alt { opacity: 0.7; font-variant-numeric: tabular-nums; }
      #stage {
        position: fixed; inset: 0; z-index: 2; display: grid; place-items: center;
        pointer-events: none; padding: 0 8vw; text-align: center;
      }
      .line {
        position: absolute; max-width: 18ch;
        font-family: var(--serif); font-weight: 300;
        font-size: clamp(30px, 4.6vw, 64px); line-height: 1.12;
        opacity: 0; filter: blur(14px); transform: translateY(16px); visibility: hidden;
        transition: opacity 1s var(--ease), filter 1s var(--ease), transform 1.1s var(--ease), visibility 0s linear 1.1s;
      }
      .line.big { font-size: clamp(56px, 9vw, 160px); font-weight: 400; max-width: none; }
      .line.on {
        opacity: 1; filter: blur(0); transform: none; visibility: visible;
        transition: opacity 1s var(--ease), filter 1s var(--ease), transform 1.1s var(--ease), visibility 0s;
      }
      .line .sub { display: block; margin-top: 22px; font-size: 15px; opacity: 0.72; font-family: var(--serif); }
      #descend {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 44px; min-width: 44px; padding: 0 10px; margin-top: 14px; pointer-events: none;
        font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em;
        text-transform: uppercase; color: var(--ink);
        text-decoration: underline; text-underline-offset: 6px;
      }
      .line.on #descend { pointer-events: auto; }
      #wisp {
        position: fixed; left: 0; top: 0; z-index: 5; width: 26px; height: 26px; margin: -13px 0 0 -13px;
        border-radius: 50%; pointer-events: none; opacity: 0;
        background: radial-gradient(circle, rgba(255, 252, 245, 0.95), rgba(242, 223, 201, 0.35) 45%, rgba(242, 223, 201, 0) 70%);
        transition: opacity 0.6s var(--ease);
      }
      @media (pointer: fine) { html.ready, html.ready * { cursor: none; } #wisp { opacity: 1; } }
      #gate {
        position: fixed; inset: 0; z-index: 10; background: var(--pearl);
        display: grid; place-items: center; gap: 0;
        transition: opacity 1.2s var(--ease); 
      }
      #gate.out { opacity: 0; pointer-events: none; }
      #gate .inner { display: grid; justify-items: center; gap: 34px; }
      #ring {
        width: 64px; height: 64px; border-radius: 50%;
        border: 1px solid rgba(31, 37, 64, 0.25); border-top-color: rgba(31, 37, 64, 0.7);
        animation: spin 2.4s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #enter { display: flex; gap: 34px; opacity: 0; transition: opacity 0.9s var(--ease); }
      #enter.on { opacity: 1; }
      #enter button {
        background: none; border: 0; cursor: pointer; color: var(--ink);
        font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em;
        text-transform: uppercase; text-decoration: underline; text-underline-offset: 6px;
        padding: 0 8px; min-height: 44px; min-width: 44px;
      }
      html:not(.ready) { overflow: hidden; }
      :focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; border-radius: 2px; }
      #enter button:focus-visible, #descend:focus-visible { text-decoration-thickness: 2px; }
      .wave { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; margin-right: 8px; vertical-align: -1px; }
      .wave i { width: 2px; height: 3px; background: currentColor; transition: height 0.3s; }
      #sound[aria-pressed="true"] .wave i { animation: bar 1.1s ease-in-out infinite; }
      .wave i:nth-child(2) { animation-delay: -0.3s; }
      .wave i:nth-child(3) { animation-delay: -0.6s; }
      .wave i:nth-child(4) { animation-delay: -0.9s; }
      @keyframes bar { 0%, 100% { height: 3px; } 50% { height: 12px; } }
      @media (prefers-reduced-motion: reduce) {
        #ring { animation-duration: 6s; }
        .line, .line.on { filter: none; transform: none; }
        .line { transition: opacity 0.6s linear, visibility 0s linear 0.6s; }
        .line.on { transition: opacity 0.6s linear, visibility 0s; }
        #wisp { transition: none; }
        #sound[aria-pressed="true"] .wave i { animation: none; height: 8px; }
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <img id="fallback" src="ascent-breach.jpg" alt="Ocean surface breaking into warm sky" />
    <p id="fallback-copy">The sky waits. This browser cannot lift you.</p>

    <div id="spacer"></div>
    <div id="whiteout"></div>

    <div id="brand" class="ui micro">ASCENT</div>
    <button id="sound" class="ui micro" aria-pressed="false" aria-label="Sound"><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span> Sound</button>
    <div id="meter" class="ui micro">
      <div class="rail"><span class="bead" id="bead"></span></div>
      <span id="alt">−120 m</span>
    </div>

    <div id="stage" aria-live="polite">
      <p class="line" aria-hidden="true" data-from="0.02" data-to="0.28">Start where the light is thin.</p>
      <p class="line big" aria-hidden="true" data-from="0.33" data-to="0.42">Rise.</p>
      <p class="line" aria-hidden="true" data-from="0.46" data-to="0.56">Nothing here remembers weight.</p>
      <p class="line" aria-hidden="true" data-from="0.62" data-to="0.70">Water learns to fall upward.</p>
      <p class="line" aria-hidden="true" data-from="0.76" data-to="0.85">Higher, the sky stops pretending to be blue.</p>
      <p class="line" aria-hidden="true" data-from="0.88" data-to="1.01">
        You made it quiet.
        <span class="sub">Stay as long as you like.</span>
        <a id="descend" href="#top" tabindex="-1">Descend</a>
      </p>
    </div>

    <div id="wisp"></div>

    <div id="gate">
      <div class="inner">
        <div id="ring"></div>
        <div id="enter">
          <button data-sound="1">Enter with sound</button>
          <button data-sound="0">Enter in silence</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
    <script>
    (function () {
      const ART_CONFIG = {
        damping: 0.055,
        ribbons: 200,
        depthMeters: -120,
        apexMeters: 11000,
        palette: {
          shallow: [0.749, 0.878, 0.886],
          deep: [0.498, 0.71, 0.769],
          champagne: [0.949, 0.874, 0.788],
          peach: [0.965, 0.788, 0.694],
          lavender: [0.725, 0.698, 0.878],
          periwinkle: [0.549, 0.576, 0.839]
        },
        scrollSpacer: "800vh",
        bands: {
          lightSea: [0, 0.32], breach: [0.32, 0.42], cloudSea: [0.42, 0.62],
          thinAir: [0.62, 0.88], ring: [0.88, 1]
        },
        // [altitude, metres] keys for the meter
        meterKeys: [[0, -120], [0.32, 0], [0.42, 2], [0.62, 1800], [0.88, 11000], [1, 11000]],
        breach: { start: 0.32, end: 0.42 },
        clouds: { count: 120, lowCount: 60, visible: [0.38, 0.7], whiteoutAt: 0.5 }
      };
      const lowTier = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 4 || Math.min(screen.width, screen.height) < 600;
      const rmq = matchMedia("(prefers-reduced-motion: reduce)");
      let reduced = rmq.matches;
      const onRm = (e) => { reduced = e.matches; };
      if (rmq.addEventListener) rmq.addEventListener("change", onRm); else if (rmq.addListener) rmq.addListener(onRm);
      const DAMP_K = -60 * Math.log(1 - ART_CONFIG.damping), PTR_K = -60 * Math.log(0.93);

      const BG_FRAG = `
        varying vec2 vUv;
        uniform float uTime, uAlt, uDrops, uDropT;
        uniform vec2 uRes, uPointer;
        uniform vec3 cShallow, cDeep, cChamp, cPeach, cLav, cPeri;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
          return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
        float caustic(vec2 p, float t){
          vec2 q = p; float c = 1.0, inten = 0.005;
          for(int n=0;n<4;n++){ float tt = t*(1.-(3.5/float(n+1)));
            q = p + vec2(cos(tt-q.x)+sin(tt+q.y), sin(tt-q.y)+cos(tt+q.x));
            c += 1.0/length(vec2(p.x/(sin(q.x+tt)/inten), p.y/(cos(q.y+tt)/inten))); }
          c /= 4.0; c = 1.17 - pow(c, 1.4); return pow(abs(c), 8.0);
        }
        void main(){
          vec2 uv = vUv; float asp = uRes.x / uRes.y; float t = uTime;
          float b = smoothstep(0.32, 0.42, uAlt);
          float s = smoothstep(0.62, 0.88, uAlt);
          float r = smoothstep(0.88, 1.0, uAlt);
          // waterline sweeping down the screen
          float wave = sin(uv.x*9.0 + t*1.3)*0.012 + sin(uv.x*23.0 - t*2.1)*0.005 + (noise(vec2(uv.x*6.0, t*0.4))-0.5)*0.02;
          float line = mix(1.12, -0.12, b) + wave;
          float dl = uv.y - line;
          float near = exp(-dl*dl*900.0);
          vec2 ruv = uv + vec2(sin(uv.y*60.0 + t*3.0), cos(uv.x*50.0 - t*2.0)) * 0.012 * exp(-dl*dl*180.0);
          // --- water ---
          float depth = (1.0 - ruv.y) * 0.6 + (1.0 - uAlt/0.32) * 0.4;
          vec3 water = mix(cShallow, cDeep, clamp(depth, 0.0, 1.0));
          vec2 cp = vec2(ruv.x*asp, ruv.y) * 6.0;
          float ca = caustic(mod(cp, 6.2831) - 250.0, t*0.35 + 23.0);
          water += vec3(0.9, 0.97, 0.95) * clamp(ca, 0.0, 1.0) * 0.16 * (0.5 + ruv.y*0.6);
          float ang = (ruv.x - 0.62) / (1.25 - ruv.y);
          float shafts = noise(vec2(ang*7.0 + t*0.08, t*0.05)) * noise(vec2(ang*17.0 - t*0.05, 3.0));
          water += vec3(0.95, 0.96, 0.9) * shafts * 0.22 * smoothstep(0.0, 1.0, ruv.y);
          // --- sky ---
          vec3 warm = mix(cPeach, cChamp, smoothstep(0.0, 0.9, uv.y));
          vec3 cool = mix(cChamp*0.6 + cLav*0.4, cLav, smoothstep(0.0, 1.0, uv.y));
          vec3 sky = mix(warm, cool, s);
          sky = mix(sky, mix(cLav, cPeri, (1.0 - smoothstep(0.0, 1.0, uv.y))*0.5 + 0.5), r);
          vec2 p = vec2((uv.x-0.5)*asp, uv.y-0.5);
          vec2 sunP = vec2(0.32*asp, 0.3);
          float sun = exp(-length(p - sunP)*5.5) * (1.0 - s*0.8);
          sky += vec3(1.0, 0.9, 0.78) * sun * 0.45;
          vec2 sg = uv*vec2(asp,1.0)*90.0; vec2 si = floor(sg);
          float st = step(0.985, hash(si)) * (1.0 - smoothstep(0.0, 0.12, length(fract(sg)-0.5)));
          st *= 0.6 + 0.4*sin(t*1.5 + hash(si+3.0)*20.0);
          sky += vec3(0.96, 0.95, 0.98) * st * s * 0.5;
          // ring
          vec2 rc = mix(vec2(0.2*asp, 0.42), vec2(0.0, 0.0), r);
          float rd = abs(length(p - rc) - 0.26);
          float ring = exp(-rd*rd*2200.0)*0.7 + exp(-rd*rd*90.0)*0.25 + exp(-length(p-rc)*4.0)*0.12;
          sky += vec3(0.95, 0.93, 0.99) * ring * smoothstep(0.82, 1.0, uAlt);
          // compose
          vec3 col = mix(water, sky, smoothstep(-0.004, 0.004, dl));
          col += vec3(0.98, 0.95, 0.88) * near * 0.55 * (b > 0.001 && b < 0.999 ? 1.0 : 0.0);
          // droplets on the lens
          float dw = uDrops;
          if (dw > 0.01) {
            float cx = floor(uv.x*asp*9.0);
            vec2 dg = vec2(uv.x*asp, uv.y + uDropT*(0.12 + hash(vec2(cx, 4.7))*0.22)) * 9.0; vec2 di = floor(dg);
            vec2 dc = vec2(hash(di), hash(di+7.1))*0.6 + 0.2;
            float rad = 0.08 + hash(di+2.3)*0.16;
            float dd = length(fract(dg) - dc);
            float m = (1.0 - smoothstep(rad*0.7, rad, dd)) * step(0.55, hash(di+9.0));
            col = mix(col, col*1.04 + 0.03, m*dw);
            col += vec3(0.98, 0.97, 0.93) * (1.0 - smoothstep(0.0, rad*0.35, length(fract(dg)-dc-vec2(-rad*0.3, rad*0.3)))) * m * dw * 0.4;
          }
          // wisp light on scene
          vec2 pp = vec2((uPointer.x-0.5)*asp, 0.5-uPointer.y);
          col += vec3(0.98, 0.95, 0.9) * exp(-length(p-pp)*9.0) * 0.06;
          gl_FragColor = vec4(clamp(col, 0.04, 0.965), 1.0);
        }`;

      const RIBBON_VERT = `
        attribute vec4 aSeed;
        uniform float uTime, uAlt, uFlow, uAspect, uHold, uCircle;
        uniform vec2 uPointer;
        varying vec2 vUv; varying float vShade, vAlpha;
        void main(){
          vUv = uv;
          float thin = smoothstep(0.75, 0.95, uAlt);
          float t = uTime * mix(1.0, 0.45, thin); float b = smoothstep(0.32, 0.42, uAlt);
          float len = mix(0.22, 0.5, b) * (0.6 + aSeed.z*0.4);
          float wid = (0.014 + aSeed.y*0.012) * mix(1.0, 0.3, thin);
          float ly = position.y * len;
          float twist = cos(position.y*4.0 + t*(0.6+aSeed.z*0.4) + aSeed.w);
          vShade = twist;
          float baseY = fract(aSeed.y + uFlow*aSeed.z) * 2.8 - 1.4;
          float x = (aSeed.x*2.0 - 1.0) * 1.05;
          x += sin(t*0.25 + aSeed.w) * 0.06 * (1.0 - b);
          x += sin(position.y*5.0 + t*1.6 + aSeed.w) * mix(0.03, 0.015, b);
          x += position.x * wid * (0.25 + 0.75*abs(twist));
          vec2 pos = vec2(x, baseY + ly);
          vec2 ptr = vec2(uPointer.x*2.0-1.0, 1.0-uPointer.y*2.0);
          vec2 d = (pos - ptr) * vec2(uAspect, 1.0);
          float dist = length(d);
          pos += (d / max(dist, 0.001)) / vec2(uAspect, 1.0) * exp(-dist*dist*18.0) * 0.16 * (1.0 - uHold);
          // press-and-hold: gather toward the wisp, then a quiet circle
          float near = exp(-dist*dist*2.5);
          pos = mix(pos, ptr + d*0.35/vec2(uAspect, 1.0), uHold * near * 0.85);
          float ang = aSeed.w + position.y * 0.55;
          vec2 ringP = ptr + vec2(cos(ang), sin(ang)) * (0.2 + position.x*wid*0.6) / vec2(uAspect, 1.0);
          pos = mix(pos, ringP, uCircle * near);
          float keep = 1.0 - smoothstep(0.62, 1.0, uAlt) * 0.82;
          vAlpha = step(fract(aSeed.z*7.31 + aSeed.x*3.7), keep);
          gl_Position = vec4(pos, 0.0, 1.0);
        }`;

      const RIBBON_FRAG = `
        uniform float uAlt;
        varying vec2 vUv; varying float vShade, vAlpha;
        void main(){
          float b = smoothstep(0.32, 0.42, uAlt), s = smoothstep(0.62, 0.95, uAlt);
          vec3 under = vec3(0.9, 0.96, 0.95);
          vec3 warm = vec3(0.98, 0.9, 0.84);
          vec3 cool = vec3(0.92, 0.9, 0.98);
          vec3 c = mix(mix(under, warm, b), cool, s);
          c *= 0.9 + 0.1*vShade;
          float edge = smoothstep(0.0, 0.3, vUv.x) * (1.0 - smoothstep(0.7, 1.0, vUv.x));
          float ends = smoothstep(0.0, 0.25, vUv.y) * (1.0 - smoothstep(0.6, 1.0, vUv.y));
          float a = (0.16 + 0.18*abs(vShade)) * edge * ends * vAlpha;
          if (a < 0.003) discard;
          gl_FragColor = vec4(c, a);
        }`;

      // scroll fraction -> altitude. Breach and Ring take ~1.6x their width in scroll,
      // blended in with smoothstep shoulders; built as a cumulative density and inverted.
      const REMAP = (function () {
        const ss = (e0, e1, x) => { const k = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return k * k * (3 - 2 * k); };
        const slow = [[0.32, 0.42], [0.88, 1.0]], blend = 0.025, gain = 0.6, N = 2000;
        const w = (x) => { let b = 0; for (const [s0, s1] of slow) b = Math.max(b, ss(s0 - blend, s0, x) * (1 - ss(s1, s1 + blend, x))); return 1 + gain * b; };
        const cum = new Float64Array(N + 1);
        for (let i = 1; i <= N; i++) { const x = (i - 0.5) / N; cum[i] = cum[i - 1] + w(x) / N; }
        const tot = cum[N];
        for (let i = 0; i <= N; i++) cum[i] /= tot;
        return { cum, N };
      })();
      function remap(t) {
        const { cum, N } = REMAP;
        if (t <= 0) return 0; if (t >= 1) return 1;
        let lo = 0, hi = N;
        while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= t) lo = m; else hi = m; }
        return (lo + (t - cum[lo]) / (cum[hi] - cum[lo])) / N;
      }
      function meters(x) {
        const K = ART_CONFIG.meterKeys;
        for (let i = 1; i < K.length; i++) {
          if (x <= K[i][0]) { const k0 = K[i - 1], k1 = K[i]; return k0[1] + (x - k0[0]) / (k1[0] - k0[0]) * (k1[1] - k0[1]); }
        }
        return K[K.length - 1][1];
      }

      const CLOUD_VERT = `
        attribute vec4 aSeed;
        varying vec2 vUv; varying vec4 vSeed; varying float vFade;
        void main(){
          vUv = uv; vSeed = aSeed;
          vec4 c4 = modelMatrix * instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
          float s = length(instanceMatrix[0].xyz);
          vec3 right = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
          vec3 up = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
          vec3 w = c4.xyz + (right * position.x + up * position.y) * s;
          vec4 mv = viewMatrix * vec4(w, 1.0);
          float d = -mv.z;
          vFade = smoothstep(1.5, 6.0, d) * (1.0 - smoothstep(55.0, 85.0, d));
          gl_Position = projectionMatrix * mv;
        }`;

      const CLOUD_FRAG = `
        uniform float uTime, uOpacity;
        varying vec2 vUv; varying vec4 vSeed; varying float vFade;
        float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
          return mix(mix(h2(i),h2(i+vec2(1,0)),f.x), mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x), f.y); }
        float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<5;i++){ v+=a*n2(p); p=p*2.03+vec2(1.7,9.2); a*=0.5; } return v; }
        void main(){
          vec2 p = vUv*2.0 - 1.0;
          vec2 q = p*1.6 + vSeed.xy*31.0 + vec2(uTime*0.015, 0.0);

          for (let i = 0; i < p.count; i++) { n.copy(map.get(key(i))).normalize(); nr.setXYZ(i, n.x, n.y, n.z); }
          nr.needsUpdate = true;
        }
        function islandGeo(r, seed) {
          const geo = new THREE.IcosahedronGeometry(r, 3);
          const p = geo.attributes.position, v = new THREE.Vector3();
          const top = r * 0.22;
          for (let i = 0; i < p.count; i++) {
            v.fromBufferAttribute(p, i);
            const d = 1 + (vnoise(v.x * 0.9 + seed, v.y * 0.9, v.z * 0.9) - 0.5) * 0.45;
            v.multiplyScalar(d);
            if (v.y > top) v.y = top + (v.y - top) * 0.06;
            else if (v.y < 0) v.y *= 1.5 + vnoise(v.x * 0.6, seed, v.z * 0.6) * 0.6;
            p.setXYZ(i, v.x, v.y, v.z);
          }
          smoothNormals(geo);
          return { geo, top };
        }
        const isleDefs = [
          { pos: [-9, 5, 4], r: 3.2, tree: 1.0, fall: true },
          { pos: [9, 12, -8], r: 4.2, tree: 1.3, fall: false },
          { pos: [-6, 20, -18], r: 2.6, tree: 0.8, fall: true },
          { pos: [11, 27, -30], r: 3.8, tree: 1.15, fall: false }
        ].slice(0, lowTier ? 3 : 4);
        const trunkGeo = new THREE.CylinderGeometry(0.07, 0.11, 1, 6);
        const blobGeo = new THREE.SphereGeometry(1, 16, 12);
        isleDefs.forEach((d, idx) => {
          const grp = new THREE.Group();
          const { geo, top } = islandGeo(d.r, idx * 7.3);
          grp.add(new THREE.Mesh(geo, isleMat));
          const tr = new THREE.Group(); const s = d.tree;
          tr.position.set(d.r * 0.15, top, -d.r * 0.1);
          const trunk = new THREE.Mesh(trunkGeo, isleMat);
          trunk.scale.set(s, 1.6 * s, s); trunk.position.y = 0.8 * s; tr.add(trunk);
          [[0, 1.85, 0, 0.62], [0.42, 1.6, 0.15, 0.45], [-0.36, 1.65, -0.12, 0.5]].forEach(([x, y, z, rr]) => {
            const b = new THREE.Mesh(blobGeo, isleMat);
            b.position.set(x * s, y * s, z * s); b.scale.setScalar(rr * s); tr.add(b);
          });
          grp.add(tr);
          if (d.fall && !lowTier) {
            const FN = 80, fp = new Float32Array(FN * 3), fs = new Float32Array(FN * 3);
            for (let i = 0; i < FN; i++) {
              fp[i * 3] = -d.r * 0.85; fp[i * 3 + 1] = top - 0.1; fp[i * 3 + 2] = d.r * 0.2;
              fs[i * 3] = Math.random(); fs[i * 3 + 1] = Math.random(); fs[i * 3 + 2] = Math.random();
            }
            const fg = new THREE.BufferGeometry();
            fg.setAttribute("position", new THREE.BufferAttribute(fp, 3));
            fg.setAttribute("aSeed", new THREE.BufferAttribute(fs, 3));
            const pts = new THREE.Points(fg, fallMat); pts.frustumCulled = false; grp.add(pts);
          }
          grp.position.set(d.pos[0], d.pos[1], d.pos[2]);
          grp.rotation.y = idx * 1.9;
          grp.userData = { baseY: d.pos[1], phase: idx * 1.7 + 0.4 };
          isles.push(grp); isleScene.add(grp);
        });
        // thin air: starfield on a large sphere, plus a rare shooting star
        starScene = new THREE.Scene();
        starCam = new THREE.PerspectiveCamera(60, vw() / vh(), 1, 300);
        starCam.lookAt(0, 0.35, -1);
        const SN = lowTier ? 250 : 600, sp = new Float32Array(SN * 3), ss = new Float32Array(SN * 2), sv = new THREE.Vector3();
        for (let i = 0; i < SN; i++) {
          sv.set(Math.random() * 2 - 1, Math.random() * 1.6 - 0.6, Math.random() * 2 - 1).normalize().multiplyScalar(120);
          sp[i * 3] = sv.x; sp[i * 3 + 1] = sv.y; sp[i * 3 + 2] = sv.z;
          ss[i * 2] = Math.random(); ss[i * 2 + 1] = Math.random();
        }
        const sg = new THREE.BufferGeometry();
        sg.setAttribute("position", new THREE.BufferAttribute(sp, 3));
        sg.setAttribute("aSeed", new THREE.BufferAttribute(ss, 2));
        starMat = new THREE.ShaderMaterial({
          uniforms: { uTime: { value: 0 }, uOpacity: { value: 0 }, uPx: { value: dpr } },
          transparent: true, depthWrite: false, depthTest: false, vertexShader: STAR_VERT, fragmentShader: STAR_FRAG
        });
        stars = new THREE.Points(sg, starMat); stars.frustumCulled = false; starScene.add(stars);
        const lg = new THREE.BufferGeometry();
        lg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(6), 3));
        lg.setAttribute("aK", new THREE.BufferAttribute(new Float32Array([0, 1]), 1));
        shootMat = new THREE.ShaderMaterial({
          uniforms: { uA: { value: 0 } }, transparent: true, depthWrite: false, depthTest: false,
          blending: THREE.NormalBlending, vertexShader: SHOOT_VERT, fragmentShader: SHOOT_FRAG
        });
        shootLine = new THREE.Line(lg, shootMat); shootLine.frustumCulled = false; shootLine.visible = false;
        starScene.add(shootLine);
        renderer.autoClear = false;

        // surface shader compile/link failures instead of rendering a blank page
        renderer.compile(scene, camera); renderer.compile(cloudScene, cloudCam);
        renderer.compile(isleScene, isleCam); renderer.compile(starScene, starCam);
        if (renderer.info.programs && renderer.info.programs.some((p) => p.diagnostics && !p.diagnostics.runnable)) throw new Error("shader");
        canvas.addEventListener("webglcontextlost", (e) => {
          e.preventDefault();
          if (renderer) renderer.setAnimationLoop(null);
          renderer = null;
          failGL(); fallbackLoop();
        }, { once: true });

        resize();
        addEventListener("resize", resize);
        renderer.setAnimationLoop(frame);
      }
      function resize() {
        if (!renderer) return;
        const W = vw(), H = vh();
        renderer.setSize(W, H, false);
        bgMat.uniforms.uRes.value.set(W, H);
        ribbonMat.uniforms.uAspect.value = W / H;
        if (cloudCam) { cloudCam.aspect = W / H; cloudCam.updateProjectionMatrix(); }
        if (isleCam) { isleCam.aspect = W / H; isleCam.updateProjectionMatrix(); }
        if (starCam) { starCam.aspect = W / H; starCam.updateProjectionMatrix(); }
      }
      function frame() {
        const t = clock.getElapsedTime();
        const rawDt = t - lastT; lastT = t;
        const dt = Math.min(0.05, Math.max(0, rawDt));
        // adaptive resolution: drop 0.25 DPR if frames average > 22 ms over 2 s
        if (rawDt > 0 && rawDt < 0.25) {
          ftA += rawDt; ftN++;
          if (ftA >= 2) { if (ftA / ftN > 0.022 && dpr > 0.75) setDpr(dpr - 0.25); ftA = ftN = 0; }
        }
        step(dt);
        const tm = reduced ? 0.3 : 1;
        bgMat.uniforms.uTime.value = t * tm;
        bgMat.uniforms.uAlt.value = a;
        bgMat.uniforms.uPointer.value.set(pointer.px, pointer.py);
        const bb = Math.min(1, Math.max(0, (a - 0.32) / 0.1));
        const thin = Math.min(1, Math.max(0, (a - 0.75) / 0.2));
        flow += dt * (0.012 + bb * 0.11) * (reduced ? 0.4 : 1) * (1 - 0.6 * thin);
        ribbonMat.uniforms.uFlow.value = flow;
        // press-and-hold gather, and the circle after 4 s
        const held = holding ? (performance.now() - holdStart) / 1000 : 0;
        hold += ((holding ? 1 : 0) - hold) * (1 - Math.exp(-2.5 * dt));
        circle += ((held > 4 && held < 8 ? 1 : 0) - circle) * (1 - Math.exp(-1.4 * dt));
        ribbonMat.uniforms.uHold.value = hold;
        ribbonMat.uniforms.uCircle.value = circle;
        // lens droplets run down for ~2 s after passing 0.38
        if (!reduced && prevAlt < 0.38 && a >= 0.38) dropStart = t;
        prevAlt = a;
        const dk = (t - dropStart) / 2;
        bgMat.uniforms.uDrops.value = dk >= 0 && dk < 1 ? Math.min(1, dk * 6) * (1 - dk * dk) : 0;
        bgMat.uniforms.uDropT.value = Math.max(0, t - dropStart);
        ribbonMat.uniforms.uTime.value = t * tm;
        ribbonMat.uniforms.uAlt.value = a;
        ribbonMat.uniforms.uPointer.value.set(pointer.px, pointer.py);
        renderer.clear();
        const [v0, v1] = ART_CONFIG.clouds.visible;
        const sop = sm(0.7, 0.8, a) * (1 - sm(0.93, 0.97, a)) * 0.85;
        if (sop > 0.001) {
          starMat.uniforms.uOpacity.value = sop;
          starMat.uniforms.uTime.value = t * (reduced ? 0.3 : 1);
          stars.rotation.y = t * 0.004 + (pointer.px - 0.5) * 0.06;
          stars.rotation.x = (pointer.py - 0.5) * 0.03;
        }
        if (t > nextShoot) {
          nextShoot = t + 25 + Math.random() * 15;
          if (!reduced && a >= 0.72 && a <= 0.95) {
            shootStart = t; const dir = Math.random() < 0.5 ? -1 : 1;
            shootFrom = [-dir * (20 + Math.random() * 25), 38 + Math.random() * 18];
            shootDir = [dir * (30 + Math.random() * 14), -(9 + Math.random() * 7)];
          }
        }
        const sk = (t - shootStart) / 1.2;
        shootLine.visible = sk >= 0 && sk < 1;
        if (shootLine.visible) {
          const hp = sk, tp = Math.max(0, sk - 0.28), pa = shootLine.geometry.attributes.position;
          pa.setXYZ(0, shootFrom[0] + shootDir[0] * tp, shootFrom[1] + shootDir[1] * tp, -100);
          pa.setXYZ(1, shootFrom[0] + shootDir[0] * hp, shootFrom[1] + shootDir[1] * hp, -100);
          pa.needsUpdate = true;
          shootMat.uniforms.uA.value = Math.min(1, sk * 8) * (1 - sk) * 0.9;
        }
        renderer.render(scene, camera);
        if (sop > 0.001 || shootLine.visible) renderer.render(starScene, starCam);
        const op = sm(v0, v0 + 0.05, a) * (1 - sm(v1 - 0.06, v1, a));
        if (op > 0.001) {
          const c = Math.min(1, Math.max(0, (a - v0) / (v1 - v0)));
          const camY = 4 + c * 11, camZ = 22 - c * 52;
          const px = (pointer.px - 0.5) * 1.2, py = (0.5 - pointer.py) * 0.6;
          cloudCam.position.set(px + Math.sin(t * 0.07) * 0.4, camY + py, camZ);
          cloudCam.lookAt(px * 0.5, camY - 3.2 - c * 2.5, camZ - 22);
          cloudMat.uniforms.uTime.value = t * tm;
          cloudMat.uniforms.uOpacity.value = op;
          renderer.render(cloudScene, cloudCam);
        }
        const iop = sm(0.55, 0.6, a) * (1 - sm(0.75, 0.8, a));
        if (iop > 0.001 && isleScene) {
          const c = Math.min(1, Math.max(0, (a - 0.55) / 0.25));
          const camY = 1 + c * 28, camZ = 22 - c * 46;
          const px = (pointer.px - 0.5) * 1.6, py = (0.5 - pointer.py) * 0.8;
          isleCam.position.set(px + Math.sin(t * 0.06) * 0.5, camY + py, camZ);
          isleCam.lookAt(px * 0.4, camY - 2.5, camZ - 22);
          const s = sm(0.62, 0.88, a);
          isleMat.uniforms.uSky.value.set(skyMix(0, s), skyMix(1, s), skyMix(2, s));
          isleMat.uniforms.uOpacity.value = iop;
          fallMat.uniforms.uOpacity.value = iop;
          fallMat.uniforms.uTime.value = t * tm;
          const bob = reduced ? 0.15 : 1;
          for (const g of isles) g.position.y = g.userData.baseY + Math.sin(t * 0.35 + g.userData.phase) * 0.45 * bob;
          renderer.clearDepth();
          renderer.render(isleScene, isleCam);
        }
      }
      function skyMix(i, s) {
        const P = ART_CONFIG.palette;
        const warm = (P.peach[i] + P.champagne[i]) * 0.5;
        const cool = ((P.champagne[i] * 0.6 + P.lavender[i] * 0.4) + P.lavender[i]) * 0.5;
        return warm + (cool - warm) * s;
      }
      let wx = -1, wy = -1;
      function step(dt) {
        // breach slows the climb; damping is per second, not per frame
        const target = remap(scrollT);
        a += (target - a) * (1 - Math.exp(-DAMP_K * dt));
        if (Math.abs(target - a) < 1e-5) a = target;
        const kp = 1 - Math.exp(-PTR_K * dt);
        pointer.px += (pointer.x - pointer.px) * kp;
        pointer.py += (pointer.y - pointer.py) * kp;
        if (Math.abs(pointer.px - wx) > 0.0005 || Math.abs(pointer.py - wy) > 0.0005) {
          wx = pointer.px; wy = pointer.py;
          wisp.style.transform = `translate(${(wx * vw()).toFixed(1)}px, ${(wy * vh()).toFixed(1)}px)`;
        }
        updateUI();
        audioAltitude();
      }

      let fallbackOn = false;
      function fallbackLoop() {
        if (fallbackOn) return;
        fallbackOn = true;
        let last = performance.now();
        (function loop(now) {
          const n = typeof now === "number" ? now : performance.now();
          const dt = Math.min(0.05, Math.max(0, (n - last) / 1000)); last = n;
          step(dt); requestAnimationFrame(loop);
        })(last);
      }
      try {
        const test = document.createElement("canvas");
        const probe = test.getContext("webgl2") || test.getContext("webgl");
        if (!probe) throw new Error("no webgl");
        const lose = probe.getExtension("WEBGL_lose_context"); if (lose) lose.loseContext();
        initGL();
      } catch (err) {
        if (renderer) { renderer.setAnimationLoop(null); renderer.dispose(); renderer = null; }
        failGL(); fallbackLoop();
      }
    })();
    </script>
  </body>
